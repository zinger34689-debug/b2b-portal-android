
name: Build B2B Portal APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - 'b2b-portal-android-main.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unpack Android project archive
        run: |
          test -f b2b-portal-android-main.zip
          unzip -q b2b-portal-android-main.zip -d android-project
          test -f android-project/B2B_Portal_Android/settings.gradle

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: android-project/B2B_Portal_Android
        run: gradle --no-daemon assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: B2B-Portal-APK
          path: android-project/B2B_Portal_Android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
